name: OBSIDIAN Cross-Platform
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test
      - run: npm run build
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test and compile Android launcher
        run: gradle -p apps/android :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Save Android test and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-android-diagnostics
          path: |
            apps/android/app/build/reports/tests/
            apps/android/app/build/test-results/
            apps/android/app/build/outputs/logs/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: obsidian-android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
